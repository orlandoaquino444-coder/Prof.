
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#245b49">
<title>ProfeFácil - Gestión docente</title>
<style>
:root{--p:#245b49;--p2:#347a61;--bg:#f2f6f3;--card:#fff;--txt:#20352b;--muted:#6c7c72;--line:#dce6df;--red:#b83232}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,system-ui,sans-serif;font-size:15px}
body.dark{--bg:#142019;--card:#202e25;--txt:#eff7f0;--muted:#b5c3b8;--line:#394b3e}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
aside{width:235px;flex-shrink:0;background:var(--p);color:white;padding:17px 12px}
.brand{font-size:23px;font-weight:bold;padding:8px 10px 20px}
.brand small{display:block;font-size:11px;font-weight:normal;margin-top:5px}
#nav{display:grid;gap:4px}
#nav button{border:0;background:transparent;color:white;text-align:left;padding:11px;border-radius:8px}
#nav button.active,#nav button:hover{background:#ffffff25}
main{flex:1;min-width:0}
header{background:var(--card);border-bottom:1px solid var(--line);padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
header input{max-width:330px}
.content{max-width:1450px;margin:auto;padding:22px}
h1{font-size:26px;margin:0 0 5px}
h2{font-size:19px;margin:0 0 12px}
h3{font-size:16px}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.stat{font-size:30px;font-weight:bold;margin-top:8px}
.btn{background:var(--card);color:var(--txt);border:1px solid var(--line);padding:9px 12px;border-radius:8px}
.btn.primary{background:var(--p);border-color:var(--p);color:white}
.btn.danger{color:var(--red)}
.btn.small{padding:5px 8px;font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--txt)}
textarea{min-height:80px;resize:vertical}
label{display:block;font-weight:bold;font-size:13px;margin-bottom:5px}
.field{margin-bottom:12px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:12px}
.badge{background:#dcefe3;color:#205b3a;padding:4px 8px;border-radius:15px;font-size:12px;display:inline-block}
.notice{background:var(--bg);padding:12px;border-radius:8px;margin:12px 0}
.empty{text-align:center;color:var(--muted);padding:25px}
.actions{display:flex;gap:5px;flex-wrap:wrap}
#toast{display:none;position:fixed;bottom:15px;right:15px;background:#183e2e;color:white;padding:13px;border-radius:9px;z-index:30;max-width:90%}
#modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center;padding:12px}
#modal.open{display:flex}
.dialog{width:min(700px,100%);max-height:92vh;overflow:auto;background:var(--card);color:var(--txt);padding:20px;border-radius:13px}
.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.progress{height:8px;background:var(--line);border-radius:10px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--p2)}
@media(max-width:760px){.app{display:block}aside{width:100%;padding:10px}.brand{padding:4px 7px 12px}#nav{display:flex;overflow-x:auto}#nav button{white-space:nowrap;padding:9px}header{padding:12px}.content{padding:12px}h1{font-size:23px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:12px}.stat{font-size:24px}}
@media print{aside,header,.toolbar,.actions,footer{display:none!important}.content{padding:0}.card{break-inside:avoid}body{background:white;color:black}}
</style>
</head>
<body>
<div class="app">
<aside>
<div class="brand">📗 ProfeFácil<small>Tu espacio de gestión docente</small></div>
<nav id="nav"></nav>
</aside>
<main>
<header>
<div><strong id="schoolTitle">Mi espacio docente</strong><div class="muted" style="font-size:12px">Organiza, enseña y evalúa</div></div>
<div class="actions">
<button class="btn" onclick="toggleDark()">◐ Tema</button>
<button class="btn" onclick="changeFont()">A+ Texto</button>
</div>
</header>
<div class="content" id="content"></div>
<footer>ProfeFácil · Gestión educativa local · Recuerda hacer copias de seguridad.</footer>
</main>
</div>
<div id="modal"><div class="dialog"><div class="dialoghead"><h2 id="modalTitle">Formulario</h2><button class="btn" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
"use strict";
const $=s=>document.querySelector(s);
const menus=[
["inicio","🏠","Inicio"],["estudiantes","👩‍🎓","Estudiantes"],["cursos","🏫","Cursos y materias"],
["tareas","📝","Tareas"],["calificaciones","📊","Calificaciones"],["asistencia","📅","Asistencia"],
["planificacion","📚","Planificación"],["examenes","✍️","Exámenes"],["calendario","🗓️","Calendario"],
["materiales","📎","Materiales"],["observaciones","💬","Observaciones"],["informes","📈","Informes"],
["ajustes","⚙️","Ajustes"]
];
const schemas={
estudiantes:{title:"Estudiantes",singular:"estudiante",fields:[
["nombre","Nombre completo","text",true],["documento","Documento o matrícula","text"],["curso","Curso","course"],["email","Correo electrónico","email"],["telefono","Teléfono de contacto","text"],["tutor","Padre, madre o tutor","text"],["fechaNacimiento","Fecha de nacimiento","date"],["estado","Estado","select","Activo","Inactivo"],["notas","Información adicional","textarea"]]},
cursos:{title:"Cursos y materias",singular:"curso",fields:[
["nombre","Nombre del curso o materia","text",true],["grado","Grado o nivel","text"],["seccion","Sección","text"],["materia","Materia","text"],["horario","Horario","text"],["aula","Aula","text"],["descripcion","Descripción","textarea"]]},
tareas:{title:"Tareas",singular:"tarea",fields:[
["titulo","Título","text",true],["curso","Curso","course"],["descripcion","Instrucciones","textarea"],["fecha","Fecha de entrega","date"],["prioridad","Prioridad","select","Normal","Alta","Urgente"],["estado","Estado","select","Pendiente","En curso","Completada"],["puntos","Puntuación máxima","number"]]},
calificaciones:{title:"Calificaciones",singular:"calificación",fields:[
["estudiante","Estudiante","student",true],["curso","Curso o materia","course"],["actividad","Actividad evaluada","text",true],["fecha","Fecha","date"],["nota","Nota obtenida","number",true],["maximo","Nota máxima","number"],["comentario","Comentario","textarea"]]},
asistencia:{title:"Asistencia",singular:"registro de asistencia",fields:[
["fecha","Fecha","date",true],["estudiante","Estudiante","student",true],["curso","Curso","course"],["estado","Estado","select","Presente","Ausente","Tarde","Justificado"],["observacion","Observación","textarea"]]},
planificacion:{title:"Planificación de clases",singular:"planificación",fields:[
["titulo","Tema de la clase","text",true],["curso","Curso","course"],["fecha","Fecha","date"],["objetivos","Objetivos de aprendizaje","textarea"],["actividades","Actividades","textarea"],["recursos","Recursos necesarios","textarea"],["evaluacion","Método de evaluación","textarea"],["estado","Estado","select","Pendiente","Preparada","Realizada"]]},
examenes:{title:"Exámenes",singular:"examen",fields:[
["titulo","Nombre del examen","text",true],["curso","Curso","course"],["fecha","Fecha del examen","date",true],["duracion","Duración en minutos","number"],["temas","Temas incluidos","textarea"],["instrucciones","Instrucciones","textarea"],["puntos","Puntuación máxima","number"]]},
calendario:{title:"Calendario",singular:"evento",fields:[
["titulo","Nombre del evento","text",true],["fecha","Fecha","date",true],["hora","Hora","time"],["tipo","Tipo","select","Clase","Examen","Entrega","Reunión","Otro"],["curso","Curso","course"],["descripcion","Descripción","textarea"]]},
materiales:{title:"Materiales educativos",singular:"material",fields:[
["titulo","Nombre del material","text",true],["curso","Curso o materia","course"],["tipo","Tipo","select","Apunte","Documento","Enlace","Video","Presentación","Otro"],["url","Enlace web (si corresponde)","url"],["descripcion","Descripción","textarea"]]},
observaciones:{title:"Observaciones",singular:"observación",fields:[
["estudiante","Estudiante","student",true],["fecha","Fecha","date",true],["tipo","Tipo","select","Académica","Conducta","Participación","Positiva","Otra"],["descripcion","Observación","textarea",true],["seguimiento","Seguimiento recomendado","textarea"]]}
};
const defaultDB={estudiantes:[],cursos:[],tareas:[],calificaciones:[],asistencia:[],planificacion:[],examenes:[],calendario:[],materiales:[],observaciones:[]};
let db=loadDB(),page="inicio",search="",font=15,editing=null;
function loadDB(){
 try{
  const v=JSON.parse(localStorage.getItem("profefacil_db")||"{}");
  return Object.assign({},structuredClone(defaultDB),v);
 }catch(e){return structuredClone(defaultDB)}
}
function save(){
 try{localStorage.setItem("profefacil_db",JSON.stringify(db));return true}
 catch(e){toast("No se pudieron guardar los datos. Exporta una copia y libera espacio.");return false}
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg){let el=$("#toast");el.textContent=msg;el.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display="none",3000)}
function today(){return new Date().toLocaleDateString("en-CA")}
function navRender(){
 $("#nav").innerHTML=menus.map(m=>`<button class="${page===m[0]?"active":""}" onclick="showPage('${m[0]}')">${m[1]} ${m[2]}</button>`).join("");
}
function showPage(p){
 page=p;search="";navRender();render();
}
function title(p){return schemas[p]?.title||menus.find(m=>m[0]===p)?.[2]||p}
function records(p){
 let list=db[p]||[];
 if(!search.trim())return list;
 const q=search.toLowerCase();
 return list.filter(r=>Object.values(r).some(v=>String(v??"").toLowerCase().includes(q)));
}
function stats(){
 const overdue=db.tareas.filter(x=>x.estado!=="Completada"&&x.fecha&&x.fecha<today()).length;
 const notes=db.calificaciones.map(x=>Number(x.nota)).filter(Number.isFinite);
 const avg=notes.length?notes.reduce((a,b)=>a+b,0)/notes.length:0;
 const present=db.asistencia.filter(x=>x.estado==="Presente").length;
 const total=db.asistencia.length;
 return {overdue,avg,present,total,rate:total?Math.round(present/total*100):0};
}
function render(){
 $("#schoolTitle").textContent=localStorage.getItem("profefacil_school")||"Mi espacio docente";
 const el=$("#content");
 if(page==="inicio"){el.innerHTML=dashboard();return}
 if(page==="informes"){el.innerHTML=reports();return}
 if(page==="ajustes"){el.innerHTML=settings();return}
 const s=schemas[page];if(!s)return;
 const rows=records(page);
 el.innerHTML=`<h1>${s.title}</h1><p class="muted">Administra, consulta, busca y actualiza tus registros.</p>
 <div class="toolbar">
 <button class="btn primary" onclick="openForm('${page}')">＋ Agregar ${s.singular}</button>
 <button class="btn" onclick="exportCSV('${page}')">Exportar CSV</button>
 <button class="btn" onclick="window.print()">Imprimir</button>
 </div>
 <div class="card"><div class="toolbar"><input placeholder="Buscar en ${s.title.toLowerCase()}..." value="${esc(search)}" oninput="search=this.value;render()"></div>
 ${tableHTML(page,rows)}</div>`;
}
function dashboard(){
 const st=stats(),due=db.tareas.filter(t=>t.estado!=="Completada"&&t.fecha&&t.fecha>=today()).sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,5);
 const events=db.calendario.filter(x=>x.fecha&&x.fecha>=today()).sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,5);
 return `<h1>¡Bienvenido a ProfeFácil! 👋</h1><p class="muted">Este es el resumen de tu actividad docente.</p>
 <div class="grid">
 ${statcard("👩‍🎓","Estudiantes",db.estudiantes.length,"estudiantes")}
 ${statcard("🏫","Cursos y materias",db.cursos.length,"cursos")}
 ${statcard("📝","Tareas pendientes",db.tareas.filter(t=>t.estado!=="Completada").length,"tareas")}
 ${statcard("⚠️","Tareas vencidas",st.overdue,"tareas")}
 ${statcard("📊","Promedio de notas",st.avg.toFixed(2),"calificaciones")}
 ${statcard("📅","Asistencia registrada",st.rate+"%","asistencia")}
 </div>
 <div class="grid"><section class="card"><h2>Accesos rápidos</h2><div class="toolbar">
 ${["estudiantes","cursos","tareas","calificaciones","asistencia","planificacion","examenes","calendario"].map(p=>`<button class="btn" onclick="showPage('${p}')">${title(p)}</button>`).join("")}
 </div></section><section class="card"><h2>Progreso de asistencia</h2><p>${st.present} asistencias marcadas como presente de ${st.total} registros.</p><div class="progress"><span style="width:${st.rate}%"></span></div><p class="muted">${st.rate}% de los registros son presencias.</p></section></div>
 <div class="grid"><section class="card"><h2>Próximas tareas</h2>${due.length?due.map(x=>`<div class="notice"><strong>${esc(x.titulo)}</strong><div class="muted">${esc(x.fecha)} · ${esc(x.estado||"Pendiente")}</div></div>`).join(""):'<div class="empty">No hay tareas próximas registradas.</div>'}</section>
 <section class="card"><h2>Próximos eventos</h2>${events.length?events.map(x=>`<div class="notice"><strong>${esc(x.titulo)}</strong><div class="muted">${esc(x.fecha)} · ${esc(x.tipo)}</div></div>`).join(""):'<div class="empty">No hay eventos futuros registrados.</div>'}</section></div>
 <div class="notice">🔐 Tus datos están guardados en este navegador. Usa Ajustes → Exportar copia de seguridad para protegerlos.</div>`;
}
function statcard(icon,label,val,target){return `<div class="card"><div>${icon} ${label}</div><div class="stat">${esc(val)}</div><button class="btn small" onclick="showPage('${target}')">Ver detalles →</button></div>`}
function tableHTML(p,rows){
 const s=schemas[p];
 if(!rows.length)return '<div class="empty">No hay registros todavía. Pulsa «Agregar» para comenzar.</div>';
 let fields=s.fields.filter(f=>!["textarea"].includes(f[2])).slice(0,5);
 return `<div class="tablewrap"><table><thead><tr>${fields.map(f=>`<th>${esc(f[1])}</th>`).join("")}<th>Acciones</th></tr></thead><tbody>${rows.map(r=>`<tr>${fields.map(f=>`<td>${cellValue(p,f,r)}</td>`).join("")}<td><div class="actions"><button class="btn small" onclick="openForm('${p}','${r.id}')">Editar</button><button class="btn small danger" onclick="delRecord('${p}','${r.id}')">Eliminar</button></div></td></tr>`).join("")}</tbody></table></div>`;
}
function cellValue(p,f,r){
 let v=r[f[0]]??"";
 if(f[0]==="estudiante"&&p!=="estudiantes")v=db.estudiantes.find(x=>x.id===v)?.nombre||v;
 if(f[0]==="curso"&&p!=="cursos")v=db.cursos.find(x=>x.id===v)?.nombre||v;
 if(f[0]==="estado"||f[0]==="tipo")return `<span class="badge">${esc(v)}</span>`;
 if(f[0]==="url"&&v)return `<a href="${esc(v)}" target="_blank" rel="noopener">Abrir enlace</a>`;
 return esc(v);
}
function reports(){
 const st=stats();
 let students=db.estudiantes.map(s=>{
  const ns=db.calificaciones.filter(n=>n.estudiante===s.id).map(n=>Number(n.nota)).filter(Number.isFinite);
  const avg=ns.length?ns.reduce((a,b)=>a+b,0)/ns.length:null;
  const at=db.asistencia.filter(a=>a.estudiante===s.id);
  return {nombre:s.nombre,curso:db.cursos.find(c=>c.id===s.curso)?.nombre||s.curso||"—",promedio:avg===null?"Sin notas":avg.toFixed(2),asistencia:at.length?Math.round(at.filter(a=>a.estado==="Presente").length/at.length*100)+"%":"Sin registros"};
 });
 return `<h1>Informes y estadísticas</h1><p class="muted">Resumen calculado a partir de tus registros.</p>
 <div class="grid">${statcard("👩‍🎓","Estudiantes",db.estudiantes.length,"estudiantes")}${statcard("📊","Notas registradas",db.calificaciones.length,"calificaciones")}${statcard("📅","Registros de asistencia",st.total,"asistencia")}${statcard("📝","Tareas vencidas",st.overdue,"tareas")}</div>
 <div class="toolbar"><button class="btn primary" onclick="exportCSV('calificaciones')">Exportar notas CSV</button><button class="btn" onclick="exportCSV('asistencia')">Exportar asistencia CSV</button><button class="btn" onclick="window.print()">Imprimir informe</button></div>
 <div class="card"><h2>Resumen individual</h2>${students.length?`<div class="tablewrap"><table><thead><tr><th>Estudiante</th><th>Curso</th><th>Promedio</th><th>Asistencia</th></tr></thead><tbody>${students.map(s=>`<tr><td>${esc(s.nombre)}</td><td>${esc(s.curso)}</td><td>${esc(s.promedio)}</td><td>${esc(s.asistencia)}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">Agrega estudiantes para crear informes.</div>'}</div>`;
}
function settings(){
 return `<h1>Ajustes y copias de seguridad</h1><p class="muted">Personaliza la aplicación y administra tus datos.</p>
 <div class="grid"><section class="card"><h2>Datos del docente</h2>
 <div class="field"><label>Nombre del espacio o institución</label><input id="schoolInput" value="${esc(localStorage.getItem("profefacil_school")||"Mi espacio docente")}"></div>
 <button class="btn primary" onclick="saveSchool()">Guardar nombre</button></section>
 <section class="card"><h2>Respaldo de datos</h2><p>Descarga todos los registros en un archivo JSON para recuperarlos después.</p>
 <div class="toolbar"><button class="btn primary" onclick="backup()">Exportar copia JSON</button><button class="btn" onclick="$('#importFile').click()">Importar copia JSON</button></div>
 <p class="muted">Importar una copia reemplazará los registros actuales. Exporta antes una copia de seguridad.</p></section>
 <section class="card"><h2>Accesibilidad</h2><p>Ajusta el tamaño del texto y el contraste de la interfaz.</p><div class="toolbar"><button class="btn" onclick="font=Math.min(22,font+1);document.body.style.fontSize=font+'px'">Aumentar texto</button><button class="btn" onclick="font=Math.max(13,font-1);document.body.style.fontSize=font+'px'">Reducir texto</button><button class="btn" onclick="toggleDark()">Cambiar tema</button></div></section>
 <section class="card"><h2>Privacidad y límites</h2><p>Esta aplicación no envía los datos a un servidor. No ofrece inicio de sesión seguro ni sincronización entre usuarios.</p><p>Evita guardar información médica sensible, contraseñas, datos personales innecesarios o información confidencial de menores en dispositivos compartidos.</p></section>
 <section class="card"><h2>Borrar todos los datos</h2><p>Esta operación no se puede deshacer si no tienes una copia.</p><button class="btn danger" onclick="clearAll()">Borrar todos los registros</button></section></div>`;
}
function optionsFor(type){
 let data=type==="course"?db.cursos:db.estudiantes;
 return `<option value="">— Seleccionar —</option>`+data.map(x=>`<option value="${esc(x.id)}">${esc(x.nombre)}</option>`).join("");
}
function fieldHTML(f,v){
 const [key,label,type,required,...opts]=f;
 const req=required===true?'required':'';
 let control="";
 if(type==="textarea")control=`<textarea name="${key}" ${req}>${esc(v)}</textarea>`;
 else if(type==="select")control=`<select name="${key}" ${req}>${opts.map(o=>`<option ${String(v)===o?'selected':''}>${esc(o)}</option>`).join("")}</select>`;
 else if(type==="course"||type==="student")control=`<select name="${key}" ${req}>${optionsFor(type)}</select>`;
 else control=`<input name="${key}" type="${type}" value="${esc(v)}" ${req} ${type==="number"?'step="any"':''}>`;
 return `<div class="field"><label>${esc(label)}${req?' *':''}</label>${control}</div>`;
}
function openForm(p,id=null){
 editing={p,id};
 const s=schemas[p],old=id?db[p].find(r=>r.id===id)||{}:{};
 $("#modalTitle").textContent=(id?"Editar ":"Agregar ")+s.singular;
 $("#modalBody").innerHTML=`<form id="recordForm"><div class="formgrid">${s.fields.map(f=>fieldHTML(f,old[f[0]]??(f[0]==="fecha"?today():""))).join("")}</div><div class="toolbar"><button class="btn primary" type="submit">Guardar</button><button class="btn" type="button" onclick="closeModal()">Cancelar</button></div></form>`;
 s.fields.forEach(f=>{if(f[2]==="course"||f[2]==="student"){let input=$(`#recordForm [name="${f[0]}"]`);if(input)input.value=old[f[0]]||""}});
 $("#recordForm").onsubmit=e=>{
  e.preventDefault();
  const fd=new FormData(e.target),data={};
  s.fields.forEach(f=>data[f[0]]=String(fd.get(f[0])??"").trim());
  if(p==="calificaciones"){
   let n=Number(data.nota),max=data.maximo===""?null:Number(data.maximo);
   if(!Number.isFinite(n)||(max!==null&&(!Number.isFinite(max)||max<=0))){toast("Revisa la nota y la nota máxima.");return}
   if(max!==null&&(n<0||n>max)){toast("La nota debe estar entre 0 y la nota máxima.");return}
  }
  if(["puntos","duracion","maximo"].some(k=>data[k]!==undefined&&data[k]!==""&&!Number.isFinite(Number(data[k])))){toast("Introduce valores numéricos válidos.");return}
  if(id){Object.assign(old,data)}else db[p].push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),...data});
  save();closeModal();render();toast("Registro guardado.");
 };
 $("#modal").classList.add("open");
}
function closeModal(){$("#modal").classList.remove("open");editing=null}
function delRecord(p,id){
 const r=db[p].find(x=>x.id===id);if(!r)return;
 if(!confirm("¿Eliminar este registro?"))return;
 db[p]=db[p].filter(x=>x.id!==id);save();render();toast("Registro eliminado.");
}
function saveSchool(){localStorage.setItem("profefacil_school",$("#schoolInput").value.trim()||"Mi espacio docente");render();toast("Nombre actualizado.")}
function toggleDark(){document.body.classList.toggle("dark");localStorage.setItem("profefacil_dark",document.body.classList.contains("dark")?"1":"0")}
function changeFont(){font=font>=20?15:font+1;document.body.style.fontSize=font+"px"}
function download(name,data,type){
 const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function backup(){
 download("profefacil-respaldo-"+today()+".json",JSON.stringify({version:1,fecha:new Date().toISOString(),db,school:localStorage.getItem("profefacil_school")||""},null,2),"application/json");
 toast("Copia de seguridad descargada.");
}
function exportCSV(p){
 const list=db[p],s=schemas[p];
 if(!list.length){toast("No hay registros para exportar.");return}
 const keys=s.fields.map(f=>f[0]),head=s.fields.map(f=>f[1]);
 const csv=[head,...list.map(r=>keys.map(k=>r[k]??""))].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\r\n");
 download(p+"-"+today()+".csv","\uFEFF"+csv,"text/csv;charset=utf-8");
}
$("#importFile").addEventListener("change",async e=>{
 const file=e.target.files[0];if(!file)return;
 try{
  const data=JSON.parse(await file.text()),incoming=data.db||data;
  if(!confirm("La importación reemplazará los registros actuales. ¿Continuar?"))return;
  for(const p of Object.keys(defaultDB)){
   if(!Array.isArray(incoming[p]))throw Error("La copia no contiene una lista válida de "+p);
  }
  db={};for(const p of Object.keys(defaultDB))db[p]=incoming[p];
  if(data.school)localStorage.setItem("profefacil_school",data.school);
  if(!save())throw Error("No hay espacio disponible para guardar los datos.");
  render();toast("Copia importada correctamente.");
 }catch(err){alert("No se pudo importar la copia: "+err.message)}
 finally{e.target.value=""}
});
function clearAll(){
 if(!confirm("¿Borrar todos los estudiantes, cursos, notas, tareas y demás registros?"))return;
 if(!confirm("Última confirmación: esta acción es irreversible sin copia de seguridad."))return;
 db=structuredClone(defaultDB);save();render();toast("Se eliminaron los registros.");
}
$("#nav").addEventListener("click",()=>{});
if(localStorage.getItem("profefacil_dark")==="1")document.body.classList.add("dark");
navRender();render();
</script>
